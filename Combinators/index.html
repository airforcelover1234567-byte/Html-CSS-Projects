<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinators
    </title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Cobinators=explains the relationship between
     listed selectors
     = descendant
     > = child
     ~ = general sibling
     + = adjacent sibling -->
     <div class="box">
        <p>THis is #1</p>
        <p>THis is #2</p>
        <div>
            <p>THis is #3</p>
        </div>
     </div>
     <p>THis is #4</p>
     <p>THis is #5</p>
</body>
</html>
